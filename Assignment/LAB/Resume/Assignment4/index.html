
<!DOCTYPE html>
<html>
<head>
    <title>Shopping Website</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body { background: #f2f2f2; }
        .product, .cart {
            background: white;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .product img {
            width: 100%;
            height: 130px;
            object-fit: contain;
        }
    </style>
</head>

<body>

<nav class="navbar bg-dark text-white p-3">
    <h4>My Shopping Store</h4>
    <span>ADBHUT SINGH | 22515000008</span>
</nav>

<div class="container-fluid mt-4">
    <div class="row">

        <div class="col-md-9">
            <h3>Products</h3>
            <div class="row" id="products"></div>
        </div>

        <div class="col-md-3">
            <div class="cart">
                <h4>Shopping Cart</h4>
                <div id="cart"></div>
                <hr>
                <h5>Grand Total: ₹<span id="total">0</span></h5>
            </div>
        </div>

    </div>
</div>

<script>

const products = [
    {
        id: 1,
        name: "Headphones",
        price: 2499,
        originalPrice: 3499,
        discount: 29,
        description: "Wireless headphones with clear sound.",
        image: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500",
        rating: 4.5,
        inStock: true
    },
    {
        id: 2,
        name: "Smart Watch",
        price: 1999,
        originalPrice: 2999,
        discount: 33,
        description: "Smartwatch for daily use.",
        image: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500",
        rating: 4.2,
        inStock: true
    },
    {
        id: 3,
        name: "Running Shoes",
        price: 1799,
        originalPrice: 2499,
        discount: 28,
        description: "Comfortable running shoes.",
        image: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500",
        rating: 4.4,
        inStock: true
    },
    {
        id: 4,
        name: "Backpack",
        price: 1299,
        originalPrice: 1999,
        discount: 35,
        description: "Bag for college and travel.",
        image: "https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=500",
        rating: 4.3,
        inStock: true
    },
    {
        id: 5,
        name: "Camera",
        price: 15999,
        originalPrice: 18999,
        discount: 16,
        description: "Digital camera for photography.",
        image: "https://images.unsplash.com/photo-1516035069371-29a1b244cc32?w=500",
        rating: 4.6,
        inStock: true
    },
    {
        id: 6,
        name: "Sunglasses",
        price: 899,
        originalPrice: 1499,
        discount: 40,
        description: "Stylish sunglasses.",
        image: "https://images.unsplash.com/photo-1511499767150-a48a237f0083?w=500",
        rating: 4.1,
        inStock: true
    },
    {
        id: 7,
        name: "Coffee Maker",
        price: 3499,
        originalPrice: 4499,
        discount: 22,
        description: "Coffee maker for home.",
        image: "https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?w=500",
        rating: 4.4,
        inStock: false
    }
];

let cart = [];

// Display Products
function showProducts() {
    document.getElementById("products").innerHTML = products.map(p => `
        <div class="col-md-4 col-sm-6">
            <div class="product">
                <img src="${p.image}">
                <h5>${p.name}</h5>
                <p>${p.description}</p>
                <b>₹${p.price}</b>
                <del> ₹${p.originalPrice}</del>
                <p>${p.discount}% OFF | ⭐ ${p.rating}</p>

                <button class="btn btn-primary w-100"
                    onclick="addCart(${p.id})"
                    ${!p.inStock ? "disabled" : ""}>
                    ${p.inStock ? "Add to Cart" : "Out of Stock"}
                </button>
            </div>
        </div>
    `).join("");
}

// Add to Cart
function addCart(id) {
    let product = products.find(p => p.id == id);
    let item = cart.find(p => p.id == id);

    if (item) {
        item.quantity++;
    } else {
        cart.push({...product, quantity: 1});
    }

    showCart();
}

// Display Cart and Total
function showCart() {
    let total = 0;

    document.getElementById("cart").innerHTML = cart.map(p => {
        let subtotal = p.price * p.quantity;
        total += subtotal;

        return `
            <div class="d-flex gap-2 align-items-center">
                <img src="${p.image}" width="50">
                <div>
                    <b>${p.name}</b>
                    <p>₹${p.price} x ${p.quantity}</p>
                    <small>Subtotal: ₹${subtotal}</small>
                </div>
            </div>
            <hr>
        `;
    }).join("") || "Cart is empty!";

    document.getElementById("total").innerHTML = total;
}

showProducts();
showCart();

</script>

</body>
</html>
