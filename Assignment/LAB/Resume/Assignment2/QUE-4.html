<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>
</head>

<body bgcolor="#FFF5F5">

    <table border="0" cellpadding="0" cellspacing="0" width="550" bgcolor="#FFFFFF" align="center">
        <tr>
            <td>
                
                <table border="0" cellpadding="20" cellspacing="0" width="100%" bgcolor="#8B0000">
                    <tr>
                        <td align="center">
                            <font color="#FFFFFF" size="5"><b>📝 STUDENT REGISTRATION FORM</b></font>
                        </td>
                    </tr>
                </table>

                <form>
                    <table border="0" cellpadding="10" cellspacing="0" width="100%">
                        
                        <tr>
                            <td width="35%" align="right">
                                <b><font color="#8B0000">Full Name:</font></b>
                            </td>
                            <td width="65%">
                                <input type="text" name="fullname" placeholder="Enter your full name" required>
                            </td>
                        </tr>

                        <tr>
                            <td align="right">
                                <b><font color="#8B0000">Email Address:</font></b>
                            </td>
                            <td>
                                <input type="email" name="email" placeholder="Enter your email" required>
                            </td>
                        </tr>

                        <tr>
                            <td align="right">
                                <b><font color="#8B0000">Password:</font></b>
                            </td>
                            <td>
                                <input type="password" name="password" placeholder="Enter password" required>
                            </td>
                        </tr>

                        <tr>
                            <td align="right" valign="top">
                                <b><font color="#8B0000">Gender:</font></b>
                            </td>
                            <td>
                                <input type="radio" id="male" name="gender" value="male">
                                <label for="male">Male</label>&nbsp;&nbsp;
                                
                                <input type="radio" id="female" name="gender" value="female">
                                <label for="female">Female</label>&nbsp;&nbsp;
                                
                                <input type="radio" id="other" name="gender" value="other">
                                <label for="other">Other</label>
                            </td>
                        </tr>

                        <tr>
                            <td align="right">
                                <b><font color="#8B0000">Course / Branch:</font></b>
                            </td>
                            <td>
                                <select name="course">
                                    <option value="">-- Select Course --</option>
                                    <option value="btech_cse">B.Tech Computer Science</option>
                                    <option value="btech_it">B.Tech Information Technology</option>
                                    <option value="bca">BCA</option>
                                    <option value="mca">MCA</option>
                                </select>
                            </td>
                        </tr>

                        <tr>
                            <td align="right" valign="top">
                                <b><font color="#8B0000">Interests:</font></b>
                            </td>
                            <td>
                                <input type="checkbox" id="coding" name="interests" value="coding">
                                <label for="coding">Coding</label><br>

                                <input type="checkbox" id="gaming" name="interests" value="gaming">
                                <label for="gaming">Gaming</label><br>

                                <input type="checkbox" id="music" name="interests" value="music">
                                <label for="music">Music</label>
                            </td>
                        </tr>

                        <tr>
                            <td colspan="2" align="center">
                                <br>
                                <input type="submit" value="Submit Registration">
                                <input type="reset" value="Reset Form">
                            </td>
                        </tr>

                    </table>
                </form>

                <table border="0" cellpadding="10" cellspacing="0" width="100%" bgcolor="#8B0000">
                    <tr>
                        <td align="center">
                            <font color="#FFFFFF" size="1">&copy; 2026 Student Portal. All rights reserved.</font>
                        </td>
                    </tr>
                </table>

            </td>
        </tr>
    </table>

</body>
</html>
