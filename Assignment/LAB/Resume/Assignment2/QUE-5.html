<!DOCTYPE html>
<html>
<head>
    <title>Login Page</title>
</head>

<body bgcolor="#0F172A">

    <table border="0" cellpadding="0" cellspacing="0" width="450" bgcolor="#1E293B" align="center">
        <tr>
            <td>
                
                <table border="0" cellpadding="20" cellspacing="0" width="100%" bgcolor="#0F172A">
                    <tr>
                        <td align="center">
                            <font color="#10B981" size="5"><b>🛅🔑🔐 USER LOGIN</b></font><br><br>
                            <font color="#94A3B8" size="2">Enter your credentials to access your account</font>
                        </td>
                    </tr>
                </table>

                <form>
                    <table border="0" cellpadding="12" cellspacing="0" width="100%">
                        
                        <tr>
                            <td width="30%" align="right">
                                <label for="username">
                                    <b><font color="#F8FAFC">Username:</font></b>
                                </label>
                            </td>
                            <td width="70%">
                                <input type="text" id="username" name="username" placeholder="Enter username" required>
                            </td>
                        </tr>

                        <tr>
                            <td align="right">
                                <label for="password">
                                    <b><font color="#F8FAFC">Password:</font></b>
                                </label>
                            </td>
                            <td>
                                <input type="password" id="password" name="password" placeholder="Enter password" required>
                            </td>
                        </tr>

                        <tr>
                            <td align="right">
                                <input type="checkbox" id="remember" name="remember">
                            </td>
                            <td>
                                <label for="remember">
                                    <font color="#94A3B8" size="2">Remember me on this device</font>
                                </label>
                            </td>
                        </tr>

                        <tr>
                            <td colspan="2" align="center">
                                <br>
                                <input type="submit" value="Sign In">
                                <input type="reset" value="Clear">
                            </td>
                        </tr>

                        <tr>
                            <td colspan="2" align="center">
                                <font color="#94A3B8" size="2">
                                    Forgot your password? <a href="#"><font color="#10B981">Reset here</font></a>
                                </font>
                            </td>
                        </tr>

                    </table>
                </form>

                <table border="0" cellpadding="10" cellspacing="0" width="100%" bgcolor="#0F172A">
                    <tr>
                        <td align="center">
                            <font color="#64748B" size="1">Secured Student Portal &copy; 2026</font>
                        </td>
                    </tr>
                </table>

            </td>
        </tr>
    </table>

</body>
</html>
