
<!DOCTYPE html>
<html>
<head>
    <title>BMI Calculator</title>

    <style>
        body {
            font-family: Arial;
            background: #eaf2f8;
            text-align: center;
        }

        .box {
            width: 350px;
            margin: 80px auto;
            padding: 25px;
            background: white;
            border-radius: 10px;
        }

        input, button {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            box-sizing: border-box;
        }

        button {
            background: darkblue;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="box">

    <h2>BMI Calculator</h2>

    <p><b>ADBHUT SINGH</b></p>
    <p>Student ID: 22515000008</p>

    <input type="number" id="weight" placeholder="Enter Weight (kg)">

    <input type="number" id="height" placeholder="Enter Height (cm)">

    <button onclick="calculateBMI()">Calculate BMI</button>

    <h3 id="result"></h3>

</div>

<script>
    function calculateBMI() {

        let weight = document.getElementById("weight").value;
        let height = document.getElementById("height").value;

        if (weight <= 0 || height <= 0 || weight == "" || height == "") {
            document.getElementById("result").innerHTML = "Enter valid values";
            return;
        }

        height = height / 100;

        let bmi = weight / (height * height);

        let category;

        if (bmi < 18.5) {
            category = "Underweight";
        }
        else if (bmi < 25) {
            category = "Normal Weight";
        }
        else {
            category = "Overweight";
        }

        document.getElementById("result").innerHTML =
            "BMI: " + bmi.toFixed(2) + "<br>" + category;
    }
</script>

</body>
</html>
