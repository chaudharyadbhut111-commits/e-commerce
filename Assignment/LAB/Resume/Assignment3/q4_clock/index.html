
<!DOCTYPE html>
<html>
<head>
    <title>Digital Clock</title>

    <style>
        body {
            font-family: Arial;
            background: #eaf2f8;
            text-align: center;
            padding-top: 100px;
        }

        .clock {
            background: #0b2145;
            color: white;
            width: 350px;
            margin: auto;
            padding: 30px;
            border-radius: 10px;
        }

        #time {
            font-size: 40px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="clock">

    <h2>Digital Clock</h2>

    <h3>ADBHUT SINGH</h3>
    <p>Student ID: 22515000008</p>

    <div id="time"></div>

    <p id="date"></p>

</div>

<script>

    function showTime() {

        let now = new Date();

        let time = now.toLocaleTimeString();

        let date = now.toDateString();

        document.getElementById("time").innerHTML = time;

        document.getElementById("date").innerHTML = date;
    }

    setInterval(showTime, 1000);

    showTime();

</script>

</body>
</html>
